# gpui-kit-grid in the browser: the web examples, each its own module and
# page (`www/<app>/`), built from its own crate in `apps/` (package
# `gpui-kit-grid-web-<app>`) over the shell every page shares (`shell/`).
# A new example is a new crate in `apps/`, a new page in `www/` and its name
# in the list of `scripts/build-wasm.sh`.
#
# Not a member of the repository's workspace: it builds only for
# `wasm32-unknown-unknown`, with its own lockfile, so the native gates never
# see it. `scripts/build-wasm.sh` builds it (see the `Makefile`).
[workspace]
members = ["shell", "apps/*"]
resolver = "3"

[workspace.package]
version = "0.0.0"
keywords = ["gpui", "grid", "wasm", "webgpu"]
categories = ["gui", "wasm"]
# The values of the repository's workspace (`Cargo.toml`), which these
# packages are not members of.
edition = "2024"
rust-version = "1.95"
publish = false
license = "Apache-2.0"
repository = "https://github.com/GigLaboCom/gpui-kit-grid"
homepage = "https://gkg.giglabo.com"

[workspace.dependencies]
# `trading/market.rs` takes the first-load signal as an `async_channel::Sender`.
async-channel = "2.3.1"
# The simulator's random walk (`trading/market.rs`).
fastrand = "2"
# The same revision as the repository's workspace (`Cargo.toml`).
gpui-kit = { git = "https://github.com/longbridge/gpui-kit", rev = "146ab45ac0d0cc9dad5f5fd05ecd38da9b3db6e7" }
gpui-kit-grid = { path = "../grid" }
gpui-kit-grid-feed = { path = "../grid-feed" }
gpui-kit-grid-web-shell = { path = "shell" }
js-sys = "0.3"
log = "0.4"
parking_lot = "0.12.5"
# The examples' theme files (`trading/theme.rs`), the page hooks' JSON and
# the orbit example's OMM data.
serde_json = "1"
# The orbit example's SGP4 propagation; as the repository's workspace
# (`Cargo.toml`), `libm` for wasm.
sgp4 = { version = "2.4.0", default-features = false, features = ["alloc", "serde", "libm"] }
# The version of the `wasm-bindgen` CLI that generates the JavaScript glue.
wasm-bindgen = "=0.2.129"
# The feed's socket (`shell/src/feed.rs`) and the page's URL parameters.
web-sys = { version = "0.3", features = ["BinaryType", "MessageEvent", "UrlSearchParams", "WebSocket"] }
web-time = "1"

# The repository's workspace lints (`Cargo.toml`), which the examples'
# code included here is written to.
[workspace.lints.clippy]
almost_complete_range = "allow"
arc_with_non_send_sync = "allow"
borrowed_box = "allow"
dbg_macro = "deny"
let_underscore_future = "allow"
manual_is_multiple_of = "allow"
map_entry = "allow"
module_inception = "allow"
non_canonical_partial_ord_impl = "allow"
reversed_empty_ranges = "allow"
single_range_in_vec_init = "allow"
style = { level = "allow", priority = -1 }
todo = "deny"
type_complexity = "allow"
