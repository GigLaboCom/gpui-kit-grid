[package]
name = "gpui-kit-grid-web-ops"
description = "The ops example in the browser: a data center's operations console during a simulated incident storm."
version.workspace = true
keywords.workspace = true
categories.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[lib]
crate-type = ["cdylib"]

[features]
# Never enabled: the examples' offscreen snapshots (`trading/snapshot.rs`)
# are native only. Declared so that their `cfg` names a known feature here.
test-support = []

[dependencies]
# What the trading module and the example's code use, included by path
# from `crates/grid/examples/`.
async-channel.workspace = true
fastrand.workspace = true
gpui-kit.workspace = true
gpui-kit-grid.workspace = true
gpui-kit-grid-web-shell.workspace = true
log.workspace = true
parking_lot.workspace = true
# The simulator's maps (`sim.rs`); as the repository's workspace
# (`Cargo.toml`).
rustc-hash = "2.1.3"
serde_json.workspace = true
wasm-bindgen.workspace = true
web-time.workspace = true

# Used by the code included by path, where cargo-machete does not look.
[package.metadata.cargo-machete]
ignored = ["async-channel", "fastrand", "gpui-kit-grid", "log", "parking_lot", "rustc-hash", "web-time"]

[lints]
workspace = true
