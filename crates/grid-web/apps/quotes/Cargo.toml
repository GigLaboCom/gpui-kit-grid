[package]
name = "gpui-kit-grid-web-quotes"
description = "The quotes grid in the browser: 150 simulated quotes by sector, from the simulator or the gateway's feed."
version.workspace = true
keywords.workspace = true
categories.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[lib]
crate-type = ["cdylib"]

[features]
# Never enabled: the examples' offscreen snapshots (`trading/snapshot.rs`)
# are native only. Declared so that their `cfg` names a known feature here.
test-support = []

[dependencies]
# What the trading module and the example's code use, included by path
# from `crates/grid/examples/`.
async-channel.workspace = true
fastrand.workspace = true
giglabo-products.workspace = true
gpui-kit.workspace = true
gpui-kit-grid.workspace = true
# The gateway's quote records, which the quotes are made from (`?feed=`).
gpui-kit-grid-feed.workspace = true
gpui-kit-grid-web-shell.workspace = true
log.workspace = true
parking_lot.workspace = true
serde_json.workspace = true
wasm-bindgen.workspace = true
web-time.workspace = true

# Used by the code included by path, where cargo-machete does not look.
[package.metadata.cargo-machete]
ignored = ["async-channel", "fastrand", "log", "parking_lot"]

[lints]
workspace = true
