<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="150 simulated quotes grouped by sector with live averages, from the in-page simulator or from a WebSocket gateway."
    />
    <title>Quotes · gpui-kit-grid in the browser</title>
    <link rel="icon" href="data:," />
    <!-- The desk's Depth theme: the sheet's own colours. -->
    <link rel="stylesheet" href="../shell.css" />
  </head>
  <body>
    <nav id="apps" aria-label="Examples"></nav>
    <p id="status">Loading…</p>
    <pre id="bench"></pre>
    <script type="module">
      // `?feed=ws://127.0.0.1:<port>` takes the quotes from the gateway
      // (`crates/grid-gateway`) instead of the in-page simulator; the bench
      // then adds the feed's latency and counters to each phase (the
      // gateway sets the rate, so `rates=` only names the phases). Stress:
      // `rows=N` static copies of the quotes, `sort=chg` to rebuild the
      // projection of every row on each update (at most every 100 ms).
      import { start } from '../shell.js';

      const feed = new URLSearchParams(location.search).has('feed');
      start({
        app: 'quotes',
        notice: 'Simulated prices, not market data',
        beforePhase: (wasm) => feed && wasm.feed_stats(true),
        phase: (wasm) => feed && { feed: JSON.parse(wasm.feed_stats(false)) },
      });
    </script>
  </body>
</html>
