# The site the way Cloudflare serves it (site/wrangler.jsonc):
# - `html_handling: auto-trailing-slash`: /start serves start/index.html
#   after a redirect to /start/, and /page serves page.html;
# - `not_found_handling: 404-page`: a miss answers 404.html with status 404;
# - the headers of the site's _headers (headers-add.conf, generated).
server {
    listen       8080;
    listen       [::]:8080;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    autoindex          off;
    # A redirect keeps the visitor's scheme, host and port behind a proxy.
    absolute_redirect  off;
    error_page         404  /404.html;

    # Inherited by every location below: none of them sets a header itself.
    include  /etc/nginx/headers-add.conf;

    # The container's own probe; Cloudflare has no such path.
    location = /healthz {
        access_log    off;
        default_type  text/plain;
        return        200  "ok\n";
    }

    location / {
        try_files  $uri $uri.html $uri/ =404;
    }
}
