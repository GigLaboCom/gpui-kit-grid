# Main configuration of the site image: an unprivileged worker, logs to the
# container's stdout and stderr, every scratch path under /tmp so that the
# root filesystem can be read-only. The site itself is in site.conf; the
# header maps are generated from the site's _headers (headers.awk).

worker_processes  auto;
pid               /tmp/nginx.pid;
error_log         /dev/stderr  warn;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';
    access_log  /dev/stdout  main;

    charset            utf-8;
    sendfile           on;
    tcp_nopush         on;
    server_tokens      off;
    keepalive_timeout  65;

    # Nothing outside /tmp is writable for the nginx user.
    client_body_temp_path  /tmp/client_body;
    proxy_temp_path        /tmp/proxy;
    fastcgi_temp_path      /tmp/fastcgi;
    uwsgi_temp_path        /tmp/uwsgi;
    scgi_temp_path         /tmp/scgi;

    # The image ships .gz twins (the demos' wasm modules among them); gzip on
    # is the fallback for what it skipped.
    gzip_static        on;
    gzip               on;
    gzip_vary          on;
    gzip_comp_level    6;
    gzip_min_length    1024;
    gzip_proxied       any;
    gzip_types         text/plain text/css text/xml application/javascript
                       application/json application/xml application/wasm
                       image/svg+xml;

    include /etc/nginx/headers-map.conf;
    include /etc/nginx/conf.d/*.conf;
}
