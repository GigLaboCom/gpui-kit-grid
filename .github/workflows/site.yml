# The documentation site: the Astro site (`site/`), the live demos built for
# the browser (`crates/grid-web`, served under `/demo/` and through
# `/embed/v1/`) and rustdoc under `/api/`, assembled into `site/dist/` and
# deployed to Cloudflare (Workers static assets, `site/wrangler.jsonc`).
#
# - A push to `main` builds and deploys.
# - A pull request builds and checks only. From a branch of this repository
#   (not a fork, which gets no secrets) it also uploads a preview version
#   under the alias `pr-<number>`, once the Cloudflare secrets exist.
#
# Secrets: CLOUDFLARE_API_TOKEN (an account token from the "Edit Cloudflare
# Workers" template, this account only) and CLOUDFLARE_ACCOUNT_ID. Without
# them the deploy and preview steps are skipped with a warning.
#
# Data the demos serve, each fetched once and cached, never in a loop:
# MVV's timetable and HSL's network (script/fetch-transit-data, compiled
# into `crates/grid/examples/data/`), and the recordings the wiki, ships and
# Helsinki demos replay, which are not committed: they come from the
# release RECORDINGS_RELEASE of this repository, checked against
# `script/site-recordings.sha256`. Without that release the site goes out
# without the recordings (a warning): wiki has no Replay, and ships and
# Helsinki stay live with no fallback. CelesTrak's elements are never
# fetched here: the site's orbit page asks CelesTrak from the visitor's
# browser, on a click.
name: Site
on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/site.yml"
      - "site/**"
      - "crates/**"
      - "script/**"
      - "Cargo.lock"
      - "Cargo.toml"
      - "ROADMAP.md"
  pull_request:
    paths:
      - ".github/workflows/site.yml"
      - "site/**"
      - "crates/**"
      - "script/**"
      - "Cargo.lock"
      - "Cargo.toml"
      - "ROADMAP.md"
  workflow_dispatch:

# One build of a ref at a time. A pull request's newer push cancels the
# older build; a deploy from `main` is never cut off halfway.
concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # Cargo fetches gpui-kit at the revision `Cargo.toml` pins; the web shell
  # also bundles a few of its icons from a checkout of that revision beside
  # this repository (`../gpui-kit`, `crates/grid-web/shell/src/icons.rs`).
  GPUI_KIT_REPOSITORY: longbridge/gpui-kit
  # The release holding the demos' recordings (see the top of this file).
  RECORDINGS_RELEASE: site-recordings-1
  # binaryen's wasm-opt, the release the local builds use.
  BINARYEN_VERSION: "116"
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_TERM_COLOR: always

jobs:
  site:
    name: Build and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # Whether the Cloudflare secrets exist (forks and a new repository
      # have none).
      HAS_CLOUDFLARE: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
    defaults:
      run:
        shell: bash
        working-directory: gpui-kit-grid
    steps:
      # This repository and gpui-kit side by side, as the web shell's icons
      # expect (`../gpui-kit`), gpui-kit at the revision `Cargo.toml` pins.
      - uses: actions/checkout@v4
        with:
          path: gpui-kit-grid
      - name: The pinned gpui-kit revision
        id: gpui-kit
        run: |
          rev=$(sed -n 's/^gpui-kit = .*rev = "\([0-9a-f]\{40\}\)".*/\1/p' Cargo.toml)
          test -n "$rev"
          echo "rev=$rev" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.GPUI_KIT_REPOSITORY }}
          ref: ${{ steps.gpui-kit.outputs.rev }}
          path: gpui-kit

      # Rust from `rust-toolchain.toml`, with the browser's target. Only
      # `main` saves the caches (the web workspace's target and the
      # registry); pull requests restore the closest.
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          rust-src-dir: gpui-kit-grid
          target: wasm32-unknown-unknown
          cache-workspaces: |
            gpui-kit-grid/crates/grid-web -> target
            gpui-kit-grid -> target
          cache-save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: rui314/setup-mold@v1
      - uses: taiki-e/install-action@v2
        with:
          # The glue's generator at the version `crates/grid-web/Cargo.toml`
          # pins, and the third-party notices of every module.
          tool: wasm-bindgen@0.2.129,cargo-about@0.9.3
      - name: Install binaryen and HarfBuzz
        run: |
          curl --fail --location --silent --show-error \
            "https://github.com/WebAssembly/binaryen/releases/download/version_${BINARYEN_VERSION}/binaryen-version_${BINARYEN_VERSION}-x86_64-linux.tar.gz" \
            | tar --extract --gzip --directory "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/binaryen-version_${BINARYEN_VERSION}/bin" >> "$GITHUB_PATH"
          # hb-subset cuts Iosevka down for the pages.
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libharfbuzz-bin
      - name: Install system dependencies
        run: script/bootstrap
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.6

      # The examples' fonts: URLs and SHA-256 pinned in the script.
      - name: Cache fonts
        id: fonts
        uses: actions/cache@v4
        with:
          path: gpui-kit-grid/crates/grid/examples/fonts
          key: example-fonts-${{ hashFiles('gpui-kit-grid/script/fetch-example-fonts') }}
      - name: Fetch fonts
        if: steps.fonts.outputs.cache-hit != 'true'
        run: python3 -I script/fetch-example-fonts

      # MVV's timetable and HSL's network, downloaded once and compiled; a
      # cache entry unused for a week goes, and the next build fetches the
      # feeds' current versions once.
      - name: Cache transit data
        id: transit
        uses: actions/cache@v4
        with:
          path: |
            gpui-kit-grid/crates/grid/examples/data/mvv-*
            gpui-kit-grid/crates/grid/examples/data/hsl-gtfs.json
            gpui-kit-grid/crates/grid/examples/data/hsl-network.tsv*
          key: transit-data-${{ hashFiles('gpui-kit-grid/script/fetch-transit-data') }}
      - name: Fetch transit data
        if: steps.transit.outputs.cache-hit != 'true'
        run: |
          python3 -I script/fetch-transit-data
          python3 -I script/fetch-transit-data --helsinki
          # The archives are compiled; the site never serves them.
          rm -f crates/grid/examples/data/*.zip

      - name: Fetch the recordings
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          data=crates/grid/examples/data
          if gh release view "$RECORDINGS_RELEASE" > /dev/null 2>&1; then
            gh release download "$RECORDINGS_RELEASE" --dir "$data" --clobber \
              --pattern ais-recording.txt --pattern hsl-recording.txt.gz --pattern wiki-recording.jsonl
            (cd "$data" && sha256sum --check --strict "$GITHUB_WORKSPACE/gpui-kit-grid/script/site-recordings.sha256")
          else
            echo "::warning::No release $RECORDINGS_RELEASE: the demos go without their recordings (no Replay in wiki, no fallback in ships and Helsinki)."
          fi

      # Every example's module, glue and notices, with only the data the
      # site may serve (`SITE=1`; RUSTC_BOOTSTRAP is set by the script).
      - name: Build the demos
        run: make -C crates/grid-web site

      - name: Build the API reference
        run: cargo doc --no-deps --locked -p gpui-kit-grid --features decimal,derive

      - name: Install the site's dependencies
        working-directory: gpui-kit-grid/site
        run: bun install --frozen-lockfile
      - name: Check the site
        working-directory: gpui-kit-grid/site
        run: bun run check
      - name: Build the site
        working-directory: gpui-kit-grid/site
        run: bun run build

      # `dist/`: the site, the demos as files under `demo/`, and rustdoc
      # under `api/`, checked against Cloudflare's limits (25 MiB a file).
      - name: Assemble dist
        run: node crates/grid-web/scripts/site-dist.mjs site/dist --api=target/doc

      # The snippets against their regions, and every internal link of dist.
      - name: Test the site
        working-directory: gpui-kit-grid/site
        run: bun test

      - name: Without Cloudflare
        if: env.HAS_CLOUDFLARE != 'true'
        run: |
          echo "::warning::No CLOUDFLARE_API_TOKEN secret: built and checked, neither deployed nor previewed."
      - name: Deploy to Cloudflare
        if: >-
          env.HAS_CLOUDFLARE == 'true' &&
          github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: gpui-kit-grid/site
          command: deploy

      # A preview of a pull request from this repository: a version, not
      # deployed, at `pr-<number>-<name>.<subdomain>.workers.dev`. Forks get
      # no secrets, so no preview: their build above still checks them.
      - name: Preview on Cloudflare
        if: >-
          env.HAS_CLOUDFLARE == 'true' &&
          github.event_name == 'pull_request' &&
          !github.event.pull_request.head.repo.fork
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: gpui-kit-grid/site
          command: versions upload --preview-alias pr-${{ github.event.number }}
