# Adapted from gpui-kit `.github/workflows/ci.yml`. Differences:
# - `cargo fmt --check` is enforced (a written rule in gpui-kit, not a CI job there);
# - clippy also lints test and example code (`--all-targets`, with `test-support`
#   so the headless UI tests and `spike_bench` are linted too);
# - the gpui-pre pin check becomes "GPUI only through a pinned gpui-kit";
# - the library is also checked without features and for
#   `wasm32-unknown-unknown`, and the web examples (`crates/grid-web`, a
#   workspace of their own) are linted;
# - gpui-kit-only jobs (recipes, gpui-shell, component-shell, website) are dropped;
# - lint, docs, the feature variants of the tests and the doc tests run on
#   Linux; macOS and Windows run the tests once: macOS runners are few, and
#   what does not depend on the platform needs none.
# - a pull request or push that changes only the site (site/, docker/site/,
#   site.yml) or Markdown at the root skips everything but `checks` (the
#   `changes` job decides); site.yml checks the site itself.
name: CI
on:
  pull_request:
  push:
    branches:
      - main
    # The crate's tags; the site's own (`site-v*`) only run site.yml.
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}-${{ github.ref_name == 'main' && github.sha || 'anysha' }}
  cancel-in-progress: true

env:
  # Debug info is most of a build's disk footprint and a large share of its
  # link time, and nothing in CI reads it (same reasoning as gpui-kit).
  CARGO_PROFILE_DEV_DEBUG: 0

# Only `main` saves caches; pull requests restore the closest `main` cache.
# Keep each job on one set of gpui-kit features: a second `cargo` invocation
# that changes them recompiles GPUI from scratch. The grid's own `decimal` and
# `derive` features do not reach gpui-kit.
jobs:
  # Whether the change touches what the jobs below build: anything but the
  # site (site/, docker/site/, site.yml, which site.yml checks) and the
  # Markdown at the root. A pull request or push that changes only those
  # skips lint, docs, the web check, the tests and the examples; `checks`
  # (typos, format) runs always, and a crate tag always runs everything.
  changes:
    name: Changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          BEFORE: ${{ github.event.before }}
          HEAD: ${{ github.sha }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            base=$PR_BASE
          elif [ "$REF_TYPE" = tag ] || [ -z "$BEFORE" ] || [ "$BEFORE" = 0000000000000000000000000000000000000000 ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          else
            base=$BEFORE
          fi
          changed=$(git diff --name-only "$base" "$HEAD")
          echo "$changed"
          if echo "$changed" | grep -qvE '^(site/|docker/site/|\.github/workflows/site\.yml$|[^/]+\.md$)'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Only the site or root Markdown changed: lint, docs, web, tests and examples are skipped."
          fi

  checks:
    name: Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Typo check
        uses: crate-ci/typos@v1.40.0
      - uses: oven-sh/setup-bun@v2
      # `CI` is set, so a path dependency or a patched Cargo.lock fails here.
      - name: GPUI only through a pinned gpui-kit
        run: |
          bun script/check-gpui-kit-pin.ts
          bun script/check-gpui-kit-pin.ts crates/grid-web/Cargo.toml
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: rustfmt
          cache: false
      - name: Format
        run: |
          cargo fmt --all --check
          cd crates/grid-web && cargo fmt --all --check
      # The files and the versions of the two crates crates.io gets.
      - name: What crates.io gets
        run: bun script/check-package.ts
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-machete@0.9.1
      # Walks every manifest under the repository, `crates/grid-web` included.
      - name: Machete
        run: cargo machete

  # On Linux: code built only for macOS (`cfg(target_os = "macos")`) is
  # compiled by the macOS tests, not linted here.
  lint:
    name: Lint
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: clippy
          cache-save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: rui314/setup-mold@v1
      - name: Install system dependencies
        run: script/bootstrap
      - name: Lint
        run: cargo clippy --workspace --all-targets --features gpui-kit-grid/test-support --locked -- --deny warnings
      # The off-by-default `decimal` feature adds `CellValue::Decimal`.
      - name: Lint with decimal
        run: cargo clippy --workspace --all-targets --features gpui-kit-grid/test-support,gpui-kit-grid/decimal --locked -- --deny warnings
      # The off-by-default `derive` feature adds `#[derive(GridColumns)]`.
      - name: Lint with derive
        run: cargo clippy --workspace --all-targets --features gpui-kit-grid/test-support,gpui-kit-grid/derive --locked -- --deny warnings

  docs:
    name: Docs and the library alone
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache-save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: rui314/setup-mold@v1
      - name: Install system dependencies
        run: script/bootstrap
      # What an application gets with no feature turned on.
      - name: Check without features
        run: cargo check -p gpui-kit-grid --locked
      - name: Docs
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps --features gpui-kit-grid/decimal,gpui-kit-grid/derive --locked
      # The two crates built from their packages, as `cargo publish` would
      # upload them: a file the build needs and `include` leaves out fails
      # here, not on a release tag.
      - name: Package for crates.io
        run: cargo publish --dry-run --locked -p gpui-kit-grid-macros -p gpui-kit-grid

  wasm:
    name: Web
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    env:
      # gpui-kit (0.10) depends on gpui_web with its default `multithreaded`
      # feature, whose `wasm_thread` dependency needs a nightly feature gate
      # even in a single-threaded build; nothing here uses a nightly feature
      # otherwise (as `crates/grid-web/scripts/build-wasm.sh`).
      RUSTC_BOOTSTRAP: 1
    steps:
      - uses: actions/checkout@v4
      # The web shell bundles a few gpui-kit icons from `../gpui-kit`
      # (`crates/grid-web/shell/src/icons.rs`), read at the tag of the
      # release `Cargo.lock` holds; cargo itself takes it from crates.io.
      - name: gpui-kit checkout for the web examples' icons
        run: |
          version=$(sed -n '/^name = "gpui-kit"$/{n;s/^version = "\(.*\)"$/\1/p;}' Cargo.lock)
          test -n "$version"
          git init -q ../gpui-kit
          git -C ../gpui-kit fetch -q --depth 1 https://github.com/longbridge/gpui-kit "refs/tags/v$version"
          git -C ../gpui-kit checkout -q FETCH_HEAD
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: wasm32-unknown-unknown
          components: clippy
          cache-workspaces: |
            .
            crates/grid-web
          cache-save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Check the library for the browser
        run: cargo check -p gpui-kit-grid --lib --target wasm32-unknown-unknown --features decimal,derive --locked
      # The shell and every example's crate (`shell/`, `apps/*`).
      - name: Lint the web examples
        working-directory: crates/grid-web
        run: cargo clippy --workspace --target wasm32-unknown-unknown --locked -- --deny warnings

  test:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    # Named after the target and runner only, so that the required checks
    # keep their names whatever else the matrix carries.
    name: Test (${{ matrix.target }}, ${{ matrix.run_on }})
    strategy:
      fail-fast: false
      # Each platform runs the tests once, for what differs between them;
      # the feature variants and the doc tests do not, and run on Linux only.
      matrix:
        include:
          - target: aarch64-apple-darwin
            run_on: macos-latest
          - target: x86_64-linux-gnu
            run_on: ubuntu-latest
            variants: true
          - target: x86_64-windows-msvc
            run_on: windows-latest
    runs-on: ${{ matrix.run_on }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache-save-if: ${{ github.ref == 'refs/heads/main' }}
      # Replaces the system `ld` on Linux and is a no-op elsewhere.
      - uses: rui314/setup-mold@v1
      - name: Install system dependencies
        if: ${{ matrix.run_on != 'windows-latest' }}
        run: script/bootstrap
      # The grid crate's `test-support` feature turns on `gpui-kit/test-support`
      # (headless UI harness: `#[gpui_kit::test]`, `TestWindowExt`), the same
      # way gpui-kit routes it through `gpui-component-story/test-support`.
      - name: Test
        run: cargo test --workspace --features gpui-kit-grid/test-support --locked
      - name: Test with decimal
        if: ${{ matrix.variants }}
        run: cargo test --workspace --features gpui-kit-grid/test-support,gpui-kit-grid/decimal --locked
      - name: Test with derive
        if: ${{ matrix.variants }}
        run: cargo test --workspace --features gpui-kit-grid/test-support,gpui-kit-grid/derive --locked
      - name: Doc tests
        if: ${{ matrix.variants }}
        run: cargo test --workspace --features gpui-kit-grid/test-support --locked --doc

  examples:
    name: Examples (release)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache-save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: rui314/setup-mold@v1
      - name: Install system dependencies
        run: script/bootstrap
      # Every example but `spike_bench`, which needs `test-support` and
      # headless Metal (macOS); the lint job builds it.
      - name: Build the examples
        run: cargo build --release -p gpui-kit-grid --examples --locked

  # A crate tag `vX.Y.Z`, once every job above passed on it: the release of
  # the library (CONTRIBUTING.md, "Releases"). The tag must name the
  # crates' version, and the install snippets on the site the tag; the
  # history carries no secret; `gpui-kit-grid-macros` and `gpui-kit-grid`
  # go to crates.io; the GitHub release opens with what to put in
  # Cargo.toml and the changes since the previous `vX.Y.Z`, and is the
  # repository's latest (site releases never are).
  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [checks, lint, docs, wasm, test, examples]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # crates.io's Trusted Publishing: a token for this job only.
      id-token: write
    env:
      # The scanner the git hooks run, checked against its release's sums.
      GITLEAKS_VERSION: 8.30.1
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: The tag names the library's version
        run: |
          version="${TAG#v}"
          for manifest in crates/grid/Cargo.toml crates/grid-feed/Cargo.toml \
            crates/grid-macros/Cargo.toml crates/grid-gateway/Cargo.toml; do
            actual="$(sed -n 's/^version = "\(.*\)"$/\1/p' "$manifest" | head -1)"
            if [ "$actual" != "$version" ]; then
              echo "::error file=$manifest::version $actual, but the tag is $TAG"
              exit 1
            fi
          done
          for page in site/src/content/docs/start.md site/src/content/docs/guides/columns.md; do
            if ! grep -q "tag = \"$TAG\"" "$page"; then
              echo "::error file=$page::the install snippet does not name $TAG"
              exit 1
            fi
          done

      # Nothing ships from a history that carries a secret.
      - name: Scan the history for secrets
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          sums="gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          (
            cd "$RUNNER_TEMP"
            curl --fail --location --silent --show-error --remote-name "$base/$archive" --remote-name "$base/$sums"
            grep " $archive\$" "$sums" | sha256sum --check --strict
            tar --extract --gzip --file "$archive" gitleaks
          )
          "$RUNNER_TEMP/gitleaks" git --no-banner --redact --config .gitleaks.toml .

      # crates.io through Trusted Publishing: no token in the secrets; the
      # publisher set on each crate names this repository and `ci.yml`. A
      # version crates.io has is skipped: a crate's first version goes up by
      # hand before its tag (crates.io takes a Trusted Publisher only for a
      # crate it has), and a rerun publishes nothing twice.
      - name: The versions crates.io lacks
        id: crates
        run: |
          agent="$GITHUB_REPOSITORY release (https://github.com/$GITHUB_REPOSITORY)"
          status() {
            curl --silent --output /dev/null --write-out '%{http_code}' --user-agent "$agent" "$1"
          }
          version="${TAG#v}"
          missing=""
          for crate in gpui-kit-grid-macros gpui-kit-grid; do
            case "$(status "https://crates.io/api/v1/crates/$crate/$version")" in
              200) echo "$crate $version is on crates.io" ;;
              404) missing="$missing $crate" ;;
              *) echo "::error::crates.io did not say whether it has $crate $version"; exit 1 ;;
            esac
          done
          echo "missing=${missing# }" >> "$GITHUB_OUTPUT"
          # A grid on crates.io before this version: the baseline of the API check.
          semver=false
          if [[ " $missing " == *" gpui-kit-grid "* ]] &&
            [ "$(status "https://crates.io/api/v1/crates/gpui-kit-grid")" = 200 ]; then
            semver=true
          fi
          echo "semver=$semver" >> "$GITHUB_OUTPUT"
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        if: steps.crates.outputs.missing != ''
        with:
          cache: false
      - name: Install system dependencies
        if: steps.crates.outputs.semver == 'true'
        run: script/bootstrap
      - uses: taiki-e/install-action@v2
        if: steps.crates.outputs.semver == 'true'
        with:
          tool: cargo-semver-checks@0.51.0
      # From the second release on: the grid's API against its last version
      # on crates.io, so a breaking change cannot ship under a minor version.
      - name: The API against the last release
        if: steps.crates.outputs.semver == 'true'
        run: cargo semver-checks --package gpui-kit-grid --only-explicit-features --features decimal --features derive
      - uses: rust-lang/crates-io-auth-action@v1
        if: steps.crates.outputs.missing != ''
        id: auth
      # Without a second build: the pull requests and `main` build these
      # packages (`cargo publish --dry-run`, Docs job).
      - name: Publish on crates.io
        if: steps.crates.outputs.missing != ''
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
          MISSING: ${{ steps.crates.outputs.missing }}
        run: |
          packages=()
          for crate in $MISSING; do packages+=(-p "$crate"); done
          cargo publish --locked --no-verify "${packages[@]}"

      - name: Cut the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          kit="$(sed -n 's/^gpui-kit = "\([^"]*\)"$/\1/p' Cargo.toml)"
          test -n "$kit"
          {
            echo 'Add it from git, with the gpui-kit release it is built against (the crate is not on crates.io yet):'
            echo
            echo '```toml'
            echo '[dependencies]'
            echo "gpui-kit = \"$kit\""
            echo "gpui-kit-grid = { git = \"https://github.com/$GITHUB_REPOSITORY\", tag = \"$TAG\" }"
            echo '```'
            echo
            echo 'Getting started: https://gkg.giglabo.com/start/'
          } > "$RUNNER_TEMP/notes.md"
          previous="$(git describe --tags --abbrev=0 --match 'v[0-9]*' "$TAG^" 2>/dev/null || true)"
          gh release create "$TAG" --title "gpui-kit-grid ${TAG#v}" --verify-tag --latest \
            --notes-file "$RUNNER_TEMP/notes.md" --generate-notes \
            ${previous:+--notes-start-tag "$previous"}
