[workspace]
members = [
    "crates/grid",
    "crates/grid-feed",
    "crates/grid-gateway",
    "crates/grid-macros",
    "crates/products",
]
resolver = "2"

[workspace.package]
# Not on crates.io yet.
publish = false
edition = "2024"
# The `rust-toolchain.toml` channel.
rust-version = "1.95"
license = "Apache-2.0"
repository = "https://github.com/GigLaboCom/gpui-kit-grid"
homepage = "https://gkg.giglabo.com"
readme = "README.md"

[workspace.dependencies]
# GPUI is reached only through `gpui-kit`, which pins the matching `gpui-pre`
# snapshot exactly (see gpui-kit CONTRIBUTING.md, "GPUI and GPUI Kit"). Never
# list `gpui-pre*` here unless it is a crate gpui-kit does not re-export (e.g.
# `gpui-pre-sum-tree`); then it must use the same exact `=x.y.z` version.
# `script/check-gpui-kit-pin.ts` enforces both rules.
#
# Pinned to a gpui-kit revision on branch `next`. To build against a local
# gpui-kit checkout instead, see CONTRIBUTING.md, "A local gpui-kit checkout".
gpui-kit = { git = "https://github.com/longbridge/gpui-kit", rev = "146ab45ac0d0cc9dad5f5fd05ecd38da9b3db6e7" }
gpui-kit-grid = { path = "crates/grid" }
gpui-kit-grid-feed = { path = "crates/grid-feed" }
gpui-kit-grid-macros = { path = "crates/grid-macros" }
# The examples' "More from GigLabo" button and dialog.
giglabo-products = { path = "crates/products" }

# `CellValue::Timestamp`. Same requirement as gpui-kit `crates/base` and
# `crates/component`. Types and UTC text only: without the `clock` feature
# there is no `Utc::now()` or `Local` (the store's clock is the only clock),
# and without `wasmbind` nothing pulls in `js-sys`.
chrono = { version = "0.4.38", default-features = false, features = ["std"] }
imbl = "7.0.2"
# Same requirement as gpui-kit `Cargo.toml`.
log = "0.4"
parking_lot = "0.12.5"
rustc-hash = "2.1.3"
# Same requirement as gpui-kit `crates/base/Cargo.toml` (feature `decimal`), so
# a grid cell holds the application's own `Decimal` type.
rust_decimal = "1.37.0"
# Same requirements as gpui-kit `Cargo.toml`.
rust-i18n = "4.2.0"
serde = { version = "1.0.219", features = ["derive"] }
# `float_roundtrip`: a float group key saved in a layout reads back bit for
# bit; the default parser can be one unit in the last place off.
serde_json = { version = "1", features = ["float_roundtrip"] }
# The ingest and job channels. `smol::channel` re-exports this crate, but
# `smol` pulls in `async-io`, which does not build for `wasm32-unknown-unknown`.
async-channel = "2.3.1"
smol = "2"
fastrand = "2"
# `std::time` on native targets; the browser clock on `wasm32-unknown-unknown`,
# where `std::time::Instant::now` panics. GPUI's executor clock is this type.
web-time = "1"
# The quotes gateway's WebSocket server (`crates/grid-gateway`), on
# `std::net`: the handshake only, no TLS.
tungstenite = { version = "0.29", default-features = false, features = ["handshake"] }
# The ships example's native transport (`crates/grid/examples/ships/native.rs`):
# TLS for Digitraffic's WebSocket and REST API with the `ring` provider (the
# versions the lockfile already holds), the platform's root certificates,
# and gzip, which Digitraffic requires of REST clients. Dev-dependencies of
# the grid only: the library gains none.
rustls = { version = "0.23.43", default-features = false, features = ["std", "ring", "tls12"] }
rustls-native-certs = "0.8.4"
flate2 = "1.1.10"
# `#[derive(GridColumns)]` (`crates/grid-macros`). The versions gpui's graph
# already locks; `syn` without `full`, which a derive of an enum does not need.
proc-macro2 = "1"
quote = "1"
syn = { version = "3", default-features = false, features = ["derive", "parsing", "printing", "proc-macro"] }
# SGP4 orbit propagation for the `orbit` example: OMM JSON straight into
# `sgp4::Elements`. `libm` instead of `std`, so it builds for
# `wasm32-unknown-unknown` too.
sgp4 = { version = "2.4.0", default-features = false, features = ["alloc", "serde", "libm"] }

# Copied from gpui-kit `Cargo.toml` [workspace.lints.clippy]. The temporary
# `useless_conversion` allowance (gpui-kit PR #2149) is not carried over.
[workspace.lints.clippy]
almost_complete_range = "allow"
arc_with_non_send_sync = "allow"
borrowed_box = "allow"
dbg_macro = "deny"
let_underscore_future = "allow"
manual_is_multiple_of = "allow"
map_entry = "allow"
module_inception = "allow"
non_canonical_partial_ord_impl = "allow"
reversed_empty_ranges = "allow"
single_range_in_vec_init = "allow"
style = { level = "allow", priority = -1 }
todo = "deny"
type_complexity = "allow"

# Profiles are not inherited from dependencies, so gpui-kit's dev profile is
# repeated here (without the tree-sitter, LSP, markdown and QuickJS entries,
# which are not in this dependency graph).
[profile.dev]
codegen-units = 16
debug = "limited"
split-debuginfo = "unpacked"

[profile.dev.package]
resvg = { opt-level = 3 }
rustybuzz = { opt-level = 3 }
taffy = { opt-level = 3 }
ttf-parser = { opt-level = 3 }
smol = { opt-level = 3 }
gpui-pre = { opt-level = 3 }
gpui-pre-platform = { opt-level = 3 }
gpui-pre-macros = { opt-level = 3 }
gpui-pre-sum-tree = { opt-level = 3 }

[workspace.metadata.typos]
files.extend-exclude = ["**/fixtures/*"]

[workspace.metadata.typos.default.extend-identifiers]
consts = "consts"

[workspace.metadata.cargo-machete]
ignored = ["log", "anyhow", "serde"]
